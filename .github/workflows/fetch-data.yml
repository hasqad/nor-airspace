name: Fetch flight data

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Fetch and upload flight data
        run: |
          DATA=$(curl -sf --max-time 12 \
            "https://opensky-network.org/api/states/all?lamin=57&lomin=4&lamax=72&lomax=32")

          COUNT=$(echo "$DATA" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(len(d.get('states') or []))" 2>/dev/null || echo "0")

          if [ "$COUNT" -gt "0" ]; then
            echo "$DATA" | aws s3 cp - s3://${{ secrets.S3_BUCKET }}/data.json \
              --content-type "application/json" \
              --cache-control "max-age=60, must-revalidate"
            echo "✅ Lastet opp $COUNT fly"
          else
            echo "⚠ Ingen data (count=$COUNT)"
          fi